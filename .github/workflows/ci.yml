name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger for a ref that missed push CI
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main runs — deploys gate on a completed run for the deployed SHA
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege — don't inherit the repo default token scope
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # All actions pinned to full commit SHAs; Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from the "packageManager" field in package.json
      # (keep the Dockerfile's pinned pnpm in sync when bumping it).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Match the Dockerfile's node:22-alpine so CI validates what ships
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test:ci

      - name: Build (node adapter, same as the Docker image)
        run: ADAPTER=node pnpm build

      - name: SSR isolation acceptance (tests/ssr)
        run: pnpm test:ssr
