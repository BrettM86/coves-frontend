<!doctype html>
<html
  class="%coves.colorscheme% %coves.font%"
  data-default-color-scheme="%coves.defaultcolorscheme%"
  %coves.grain%
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <!-- Stable, unhashed icon URLs: Google Search wants a favicon whose URL
         does not change between deploys, and crawlers also probe
         /favicon.ico. All four are the lil_dude mascot. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- hooks.server.ts swaps the comment below for an inline script that
         applies the stored colour scheme and theme colours before first
         paint, so first paint waits on no request. -->
    <!--%coves.themeboot%-->
    %sveltekit.head%
  </head>
  <body>
    <div
      style="z-index:-50;position:absolute;inset:0;display:grid;place-items:center; "
    >
      <img src="%coves.favicon%" width="50" height="50" alt="" />
    </div>
    <div style="display: contents;" data-sveltekit-preload-code>
      %sveltekit.body%
    </div>
  </body>
</html>
