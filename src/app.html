<!doctype html>
<html
  class="%coves.colorscheme% %coves.font%"
  data-default-color-scheme="%coves.defaultcolorscheme%"
  %coves.grain%
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%coves.favicon%" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- hooks.server.ts swaps the comment below for an inline script that
         applies the stored colour scheme and theme colours before first
         paint, so first paint waits on no request. -->
    <!--%coves.themeboot%-->
    %sveltekit.head%
  </head>
  <body>
    <div
      style="z-index:-50;position:absolute;inset:0;display:grid;place-items:center; "
    >
      <img src="%coves.favicon%" width="50" height="50" alt="" />
    </div>
    <div style="display: contents;" data-sveltekit-preload-code>
      %sveltekit.body%
    </div>
  </body>
</html>
